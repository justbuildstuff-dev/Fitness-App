name: TEMP - Generate worker lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (generates package-lock.json)
        working-directory: cloudflare-worker
        run: npm install

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-package-lock
          path: cloudflare-worker/package-lock.json
          retention-days: 1

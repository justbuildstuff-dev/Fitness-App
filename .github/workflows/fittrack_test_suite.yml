name: FitTrack Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'fittrack/**'
      - '.github/workflows/fittrack_test_suite.yml'
  pull_request:
    branches:
      - main
      - 'feature/**'  # Run on PRs to feature branches (task→feature)
      - 'bug/**'      # Run on PRs to bug branches (task→bug)
    paths:
      - 'fittrack/**'
      - '.github/workflows/fittrack_test_suite.yml'
  workflow_dispatch:
    inputs:
      run_android_e2e:
        description: 'Force-run Android E2E tests (ignores path filter)'
        type: boolean
        default: false

# Required permissions for PR comments and test reports
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Parallel test execution for faster feedback
  #
  # Test Job Descriptions:
  # - check-changes: Detects whether Android-relevant files changed (gates integration-tests)
  # - unit-tests: Fast validation of business logic (models, services, providers) using mocks
  # - widget-tests: UI component testing with mocked dependencies
  # - integration-tests: End-to-end tests on Android emulator (SLOW, known flaky - see #29)
  #     Skipped automatically on PWA-only PRs (no android/** or integration_test/** changes).
  #     Override with workflow_dispatch input run_android_e2e=true. See #490.
  # - enhanced-tests: REAL Firebase integration tests connecting to emulators (validates actual Firebase operations)
  # - performance-tests: Edge case and performance validation
  # - security-checks: Dependency audits and security scanning
  # - playwright-e2e: Playwright browser tests against compiled Flutter web output (non-blocking)
  #
  # See Docs/Testing/TestClassification.md for complete test type definitions

  check-changes:
    name: Detect Changed File Paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    outputs:
      android_changed: ${{ steps.filter.outputs.android }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Check for Android/integration_test file changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          android:
            - 'fittrack/android/**'
            - 'fittrack/integration_test/**'

  unit-tests:
    name: Unit Tests (Business Logic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        cache: true
        
    - name: Install dependencies
      run: |
        cd fittrack
        flutter pub get
        flutter pub deps
        
    - name: Generate mocks and build artifacts
      run: |
        cd fittrack
        # Remove --verbose for faster builds (only needed for debugging)
        dart pub run build_runner build --delete-conflicting-outputs

    - name: Verify mock generation
      run: |
        cd fittrack
        echo "Checking for generated mock files..."
        find test -name "*.mocks.dart" | head -10 || echo "No mock files found"

    - name: Run static analysis
      run: |
        cd fittrack
        flutter analyze lib/ --no-fatal-warnings | tee analyze_output.txt
        # Check if there are any actual ERROR level issues
        if grep -q "error •" analyze_output.txt; then
          echo "ERROR level issues found - failing build"
          exit 1
        else
          echo "Only INFO/WARNING level issues found - continuing build"
          exit 0
        fi

    - name: Run unit tests
      timeout-minutes: 25
      run: |
        cd fittrack
        # Run all unit tests with github reporter for green tick annotations
        # IMPORTANT: Use --concurrency=1 to ensure immediate output for each test.
        # With concurrency>1, output gets buffered and GitHub kills the job thinking it's hung.
        # The provider tests especially can run for 15+ minutes with buffered output.
        flutter test test/models/ test/services/ test/providers/ \
          --concurrency=1 \
          --reporter=github

  widget-tests:
    name: Widget Tests (UI Components)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        cache: true
        
    - name: Install dependencies
      run: |
        cd fittrack
        flutter pub get
        flutter pub deps
        
    - name: Generate mocks and build artifacts
      run: |
        cd fittrack
        dart pub run build_runner build --delete-conflicting-outputs

    - name: Run widget tests
      run: |
        cd fittrack
        # Run widget tests with better error handling
        flutter test test/widgets/ test/screens/ \
          --timeout=60s \
          --reporter=github
          
    - name: Check widget test results
      run: |
        cd fittrack
        echo "Widget test execution completed"
          

  integration-tests:
    name: E2E Tests (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # Skipped on PRs with no android/** or integration_test/** changes to save ~80 min CI time.
    # Force-run via workflow_dispatch with run_android_e2e=true. See issue #490.
    needs: [check-changes]
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.check-changes.outputs.android_changed == 'true' ||
       github.event.inputs.run_android_e2e == 'true')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Free Disk Space for Android Emulator
      run: |
        echo "=== Disk space BEFORE cleanup ==="
        df -h
        echo ""

        echo "=== Removing unused components ==="
        # Remove .NET runtime (~2.7GB)
        sudo rm -rf /usr/share/dotnet

        # Remove Haskell (~5.3GB)
        sudo rm -rf /opt/ghc

        # Remove CodeQL (~5GB)
        sudo rm -rf /opt/hostedtoolcache/CodeQL

        # Remove large misc packages (~4GB)
        # Note: Keep NDK for caching - commented out to allow NDK caching to work
        # sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/local/share/boost

        # Clean Docker system (~4GB)
        sudo docker system prune -af

        # Clean apt cache (~1GB)
        sudo apt-get clean

        echo ""
        echo "=== Disk space AFTER cleanup ==="
        df -h
        echo ""
        echo "✅ Cleanup complete"

    - name: Setup Java for Android
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle dependencies and NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
          /usr/local/lib/android/sdk/ndk
        key: ${{ runner.os }}-gradle-ndk-${{ hashFiles('fittrack/**/*.gradle*', 'fittrack/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-ndk-
          ${{ runner.os }}-gradle-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        cache: false  # Internal cache disabled: uses unscoped ** glob that breaks post-step after emulator runs

    - name: Cache Flutter pub packages
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('fittrack/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Setup Node.js for Firebase CLI
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Install dependencies
      run: |
        cd fittrack
        flutter pub get
        flutter pub deps
        
    - name: Generate mocks and build artifacts
      run: |
        cd fittrack
        dart pub run build_runner build --delete-conflicting-outputs

    - name: Start Firebase emulators
      run: |
        cd fittrack
        # Start emulators with explicit project ID to ensure consistent project context.
        # This ensures our security rules are applied and the emulator accepts requests
        # from the app (which uses projectId: fitness-app-8505e in firebase_options.dart).
        firebase emulators:start --only auth,firestore --project fitness-app-8505e &
        echo $! > emulator.pid
        echo "✅ Firebase emulators started with custom security rules"
        
    - name: Wait for emulators
      run: |
        echo "⏳ Waiting for Firebase emulators to start..."
        sleep 15

        # Wait for emulators to be ready with retry logic
        for i in {1..30}; do
          echo "🔍 Checking emulator availability (attempt $i/30)..."

          # Check if both ports are listening
          if nc -z localhost 8080 && nc -z localhost 9099; then
            echo "✅ Both Firebase emulators are responding on their ports"
            break
          fi

          if [ $i -eq 30 ]; then
            echo "⚠️  Emulators not ready after 30 attempts, continuing anyway"
          else
            sleep 2
          fi
        done

        # Final verification with proper endpoints
        echo "🔍 Testing Firestore emulator endpoint..."
        curl -f http://localhost:8080/v1/projects/fitness-app-8505e/databases || echo "⚠️  Firestore endpoint not ready"
        echo "✅ Firestore emulator: localhost:8080"

        echo "🔍 Testing Auth emulator endpoint..."
        curl -f http://localhost:9099/identitytoolkit.googleapis.com/v1/projects/fitness-app-8505e || echo "⚠️  Auth endpoint not ready"
        echo "✅ Auth emulator: localhost:9099"

        echo "📱 Android emulator will access Firebase emulators via adb reverse tunnels (localhost:8080 and localhost:9099)"
        echo "✅ Firebase emulators ready for integration testing"
        
        echo "Firebase emulator setup completed - proceeding with tests"
        
    - name: Run integration tests
      run: |
        cd fittrack
        # Note: Cascade delete integration test runs with Android emulator below
        echo "Cascade delete integration test will run with Android emulator tests"
          
    - name: Enable KVM group permissions
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        
    - name: Run Android Integration Test
      id: integration_test
      # Note: We don't use continue-on-error here because we need accurate failure detection
      # The all-tests-passed job already treats integration-tests as non-blocking (known flaky)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: google_apis
        arch: x86_64
        profile: pixel_2
        ram-size: 1536M
        heap-size: 256M
        disk-size: 2048M
        avd-name: test
        disable-animations: true
        emulator-boot-timeout: 900
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: |
          set +e  # Don't exit on error, we want to capture output

          echo "🔍 Starting Android Integration Test..."
          echo "📱 Flutter and emulator info:"
          flutter --version
          flutter devices -v

          echo "🔗 Verifying Firebase emulator connectivity:"
          curl -f http://localhost:8080/ && echo "✅ Firestore emulator responding" || echo "❌ Firestore emulator not responding"
          curl -f http://localhost:9099/ && echo "✅ Auth emulator responding" || echo "❌ Auth emulator not responding"

          echo "⏰ Warming up Android emulator before tests..."
          adb devices -l
          adb -s emulator-5554 shell pm list packages | head -5 || echo "Emulator warming up..."
          sleep 10

          # Run comprehensive emulator health check
          echo "🔍 Running comprehensive emulator health checks..."
          chmod +x fittrack/scripts/verify_emulator_ready.sh
          ./fittrack/scripts/verify_emulator_ready.sh

          # Set up adb reverse port forwarding so the Android emulator can reach
          # Firebase emulators via localhost rather than 10.0.2.2.
          # This is critical: Firestore uses gRPC (HTTP/2) which is unreliable through
          # QEMU NAT (10.0.2.2) on GitHub Actions Linux, but works reliably via the
          # direct TCP tunnel created by adb reverse.
          echo "🔌 Setting up adb reverse port forwarding for Firebase emulators..."
          adb -s emulator-5554 reverse tcp:8080 tcp:8080 && echo "✅ Firestore port 8080 forwarded" || echo "⚠️  Firestore port forward failed — Firestore emulator may be unreachable"
          adb -s emulator-5554 reverse tcp:9099 tcp:9099 && echo "✅ Auth port 9099 forwarded" || echo "⚠️  Auth port forward failed — Auth emulator may be unreachable"
          adb -s emulator-5554 reverse --list

          bash $GITHUB_WORKSPACE/fittrack/scripts/run_integration_tests.sh 2400 1200 1200 1200

    - name: Retry Integration Test on Failure
      if: failure() && steps.integration_test.outcome == 'failure'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: google_apis
        arch: x86_64
        profile: pixel_2
        ram-size: 1536M
        heap-size: 256M
        disk-size: 2048M
        avd-name: test-retry
        disable-animations: true
        emulator-boot-timeout: 900
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: |
          echo "::warning::Integration test failed on first attempt, retrying once..."
          echo "⏳ Waiting 30 seconds before retry..."
          sleep 30

          echo "🔍 Starting Android Integration Test (Retry Attempt)..."
          echo "📱 Flutter and emulator info:"
          flutter --version
          flutter devices -v

          echo "🔗 Verifying Firebase emulator connectivity:"
          curl -f http://localhost:8080/ && echo "✅ Firestore emulator responding" || echo "❌ Firestore emulator not responding"
          curl -f http://localhost:9099/ && echo "✅ Auth emulator responding" || echo "❌ Auth emulator not responding"

          echo "⏰ Warming up Android emulator before tests..."
          adb devices -l
          adb -s emulator-5554 shell pm list packages | head -5 || echo "Emulator warming up..."
          sleep 10

          # Verify emulator is responsive
          echo "🔍 Checking emulator health..."
          adb -s emulator-5554 shell echo "emulator-ready" 2>/dev/null || (echo "⚠️  Emulator not responding, waiting longer..." && sleep 15)

          # Set up adb reverse port forwarding (same as initial run)
          echo "🔌 Setting up adb reverse port forwarding for Firebase emulators..."
          adb -s emulator-5554 reverse tcp:8080 tcp:8080 && echo "✅ Firestore port 8080 forwarded" || echo "⚠️  Firestore port forward failed"
          adb -s emulator-5554 reverse tcp:9099 tcp:9099 && echo "✅ Auth port 9099 forwarded" || echo "⚠️  Auth port forward failed"
          adb -s emulator-5554 reverse --list

          bash $GITHUB_WORKSPACE/fittrack/scripts/run_integration_tests.sh 1800 900 900 900

    - name: Analyze Integration Test Failure
      if: steps.integration_test.outcome == 'failure'
      run: |
        echo "::group::Analyzing integration test failure..."

        # Read test output from log file
        TEST_LOG="/tmp/last_test_output.log"

        if [ ! -f "$TEST_LOG" ]; then
          echo "::warning::No test output log found, cannot classify failure"
          echo "::endgroup::"
          exit 0
        fi

        # Check for known infrastructure failure patterns
        FAILURE_TYPE="UNKNOWN"
        TEST_OUTPUT=$(cat "$TEST_LOG" 2>/dev/null || echo "")

        # Pattern matching for infrastructure failures (check test output)
        if echo "$TEST_OUTPUT" | grep -qi "Failed to install\|installation failed\|Could not install"; then
          FAILURE_TYPE="INFRASTRUCTURE: APK Installation"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: APK installation issue"
          echo "This is likely a transient emulator issue, not a code problem."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "install" | head -5

        elif echo "$TEST_OUTPUT" | grep -qi "Timed out\|TIMEOUT\|Command timed out"; then
          FAILURE_TYPE="INFRASTRUCTURE: Timeout"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: Operation timeout"
          echo "This is likely due to slow emulator or CI runner resource constraints."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "timeout\|timed out" | head -5

        elif echo "$TEST_OUTPUT" | grep -qi "Connection refused\|ECONNREFUSED\|connect ECONNREFUSED"; then
          FAILURE_TYPE="INFRASTRUCTURE: Network/Connection"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: Network connection issue"
          echo "This is likely an emulator-to-host connectivity problem."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "connection\|ECONNREFUSED" | head -5

        elif echo "$TEST_OUTPUT" | grep -qi "adb.*error\|adb.*failed\|device offline\|device not found"; then
          FAILURE_TYPE="INFRASTRUCTURE: ADB Connection"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: ADB connection issue"
          echo "This is likely an emulator communication problem."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "adb\|device" | head -5

        elif echo "$TEST_OUTPUT" | grep -qi "Gradle.*failed\|download.*failed\|Could not download\|build failed"; then
          FAILURE_TYPE="INFRASTRUCTURE: Build/Download"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: Build dependency issue"
          echo "This is likely a Gradle or NDK download problem."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "gradle\|download\|build" | head -5

        elif echo "$TEST_OUTPUT" | grep -qi "emulator.*not responding\|AVD.*failed\|emulator.*error"; then
          FAILURE_TYPE="INFRASTRUCTURE: Emulator"
          echo "::warning::INFRASTRUCTURE FAILURE DETECTED: Emulator startup/stability issue"
          echo "This is likely an emulator infrastructure problem."
          echo ""
          echo "Error excerpt:"
          echo "$TEST_OUTPUT" | grep -i "emulator\|AVD" | head -5

        else
          FAILURE_TYPE="CODE: Test Assertion or Logic"
          echo "::error::CODE FAILURE DETECTED: This appears to be a test or code issue"
          echo "Review test logs carefully - this may be a real bug."
          echo ""
          echo "Last 20 lines of test output:"
          tail -20 "$TEST_LOG"
        fi

        echo ""
        echo "================================================"
        echo "FAILURE CLASSIFICATION: $FAILURE_TYPE"
        echo "================================================"
        echo ""
        echo "See Docs/Process/CI_Integration_Tests_Guide.md for troubleshooting steps."
        echo "::endgroup::"

    - name: Stop Firebase emulators
      if: always()
      run: |
        cd fittrack
        if [ -f emulator.pid ]; then
          kill $(cat emulator.pid) || true
          rm emulator.pid
        fi
        pkill -f "firebase" || true
        pkill -f "java.*firestore" || true
      

  performance-tests:
    name: Performance Tests (Edge Cases)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        cache: true
        
    - name: Install dependencies
      run: |
        cd fittrack
        flutter pub get
        flutter pub deps
        
    - name: Generate mocks and build artifacts
      run: |
        cd fittrack
        dart pub run build_runner build --delete-conflicting-outputs

    - name: Run performance tests
      run: |
        cd fittrack
        flutter test test/models/analytics_edge_cases_test.dart \
          --reporter=github
          

  # Real Firebase integration tests using emulators
  # These tests MUST connect to Firebase and validate actual operations
  enhanced-tests:
    name: Integration Tests (Firebase Emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        cache: true
        
    - name: Setup Node.js for Firebase CLI
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Install dependencies
      run: |
        cd fittrack
        flutter pub get
        flutter pub deps
        
    - name: Generate mocks and build artifacts
      run: |
        cd fittrack
        dart pub run build_runner build --delete-conflicting-outputs

    - name: Run enhanced unit tests
      run: |
        cd fittrack
        # Run enhanced model tests first (most reliable)
        flutter test test/models/enhanced_program_test.dart test/models/enhanced_exercise_test.dart \
          --coverage \
          --timeout=60s \
          --reporter=github
          
    - name: Start Firebase emulators for enhanced integration
      run: |
        cd fittrack
        firebase emulators:start --only auth,firestore &
        echo $! > emulator.pid

    - name: Wait for Firebase emulators to be ready
      run: |
        echo "Waiting for Firestore emulator on localhost:8080..."
        timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done' || {
          echo "ERROR: Firestore emulator failed to start"
          exit 1
        }
        echo "Waiting for Auth emulator on localhost:9099..."
        timeout 60 bash -c 'until curl -s http://localhost:9099 > /dev/null; do sleep 2; done' || {
          echo "ERROR: Auth emulator failed to start"
          exit 1
        }
        echo "✅ Firebase emulators are ready"
        
    - name: Run enhanced integration tests
      run: |
        cd fittrack
        # IMPORTANT: These tests MUST connect to Firebase emulators
        # IMPORTANT: These tests MUST create real data in Firestore
        # IMPORTANT: These tests MUST validate actual Firebase operations
        flutter test test/screens/enhanced_create_program_screen_test.dart \
          --timeout=120s \
          --reporter=github
          
    - name: Stop emulators
      if: always()
      run: |
        cd fittrack
        if [ -f emulator.pid ]; then
          kill $(cat emulator.pid) || true
          rm emulator.pid
        fi
        pkill -f "firebase" || true
        pkill -f "java.*firestore" || true

  # Aggregate results and generate reports
  test-summary:
    name: Test Summary Report
    runs-on: ubuntu-latest
    needs: [unit-tests, widget-tests, integration-tests, performance-tests, enhanced-tests]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always() # Run even if some tests fail
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check test results
      run: echo "Checking test results from previous jobs"
      
    - name: Generate test summary
      run: |
        echo "# FitTrack Test Suite Results" > test-summary.md
        echo "" >> test-summary.md
        echo "## Test Execution Summary" >> test-summary.md
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> test-summary.md
        echo "- Widget Tests: ${{ needs.widget-tests.result }}" >> test-summary.md
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> test-summary.md
        echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> test-summary.md
        echo "- Enhanced Tests: ${{ needs.enhanced-tests.result }}" >> test-summary.md
        echo "" >> test-summary.md
        echo "## Coverage Report" >> test-summary.md
        echo "Coverage reports available in artifacts." >> test-summary.md
        
    - name: Comment test summary on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  integration-coverage-check:
    name: Integration Test Coverage Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for service modifications without integration tests
      if: github.event_name == 'pull_request'
      run: |
        echo "🔍 Checking for service file modifications..."

        # Get the base branch for comparison
        git fetch origin ${{ github.base_ref }}
        BASE_SHA=$(git rev-parse origin/${{ github.base_ref }})

        # Find all modified service files
        MODIFIED_SERVICES=$(git diff --name-only $BASE_SHA HEAD | grep '^fittrack/lib/services/.*\.dart$' || true)

        if [ -z "$MODIFIED_SERVICES" ]; then
          echo "✅ No service files modified - integration test check passed"
          exit 0
        fi

        echo "📝 Modified service files:"
        echo "$MODIFIED_SERVICES"
        echo ""

        # Track missing integration tests
        MISSING_TESTS=""

        # For each modified service file, check if corresponding integration test exists or was modified
        for SERVICE_FILE in $MODIFIED_SERVICES; do
          # Extract service name (e.g., firestore_service.dart → firestore_service)
          SERVICE_NAME=$(basename "$SERVICE_FILE" .dart)

          # Expected integration test file
          INTEGRATION_TEST="fittrack/test/services/${SERVICE_NAME}_integration_test.dart"

          # Check if integration test file exists
          if [ ! -f "$INTEGRATION_TEST" ]; then
            echo "❌ Missing: $INTEGRATION_TEST (required for $SERVICE_FILE)"
            MISSING_TESTS="$MISSING_TESTS\n- $INTEGRATION_TEST"
          else
            # Check if integration test was modified in this PR
            TEST_MODIFIED=$(git diff --name-only $BASE_SHA HEAD | grep "^${INTEGRATION_TEST}$" || true)
            if [ -z "$TEST_MODIFIED" ]; then
              echo "⚠️  Warning: $INTEGRATION_TEST exists but was not modified"
              echo "   Consider updating tests if service behavior changed"
            else
              echo "✅ Found: $INTEGRATION_TEST (modified in PR)"
            fi
          fi
        done

        # Fail if any integration tests are missing
        if [ -n "$MISSING_TESTS" ]; then
          echo ""
          echo "❌ INTEGRATION TEST COVERAGE CHECK FAILED"
          echo ""
          echo "The following service files were modified but lack integration tests:"
          echo -e "$MISSING_TESTS"
          echo ""
          echo "📖 Integration Test Requirement:"
          echo "   - All service modifications MUST have corresponding integration tests"
          echo "   - Template: fittrack/test/services/INTEGRATION_TEST_TEMPLATE.dart"
          echo "   - Helper: test/helpers/firebase_integration_test_helper.dart"
          echo "   - Guide: Docs/Testing/TestClassification.md"
          echo ""
          echo "🔧 To fix:"
          echo "   1. Copy INTEGRATION_TEST_TEMPLATE.dart"
          echo "   2. Rename to ${SERVICE_NAME}_integration_test.dart"
          echo "   3. Implement tests using FirebaseIntegrationTestHelper"
          echo "   4. Test MUST connect to Firebase emulators"
          echo "   5. Test MUST validate actual Firebase operations"
          echo ""
          exit 1
        fi

        echo ""
        echo "✅ Integration test coverage check passed"

  all-tests-passed:
    name: All Tests Status
    runs-on: ubuntu-latest
    needs: [check-changes, unit-tests, widget-tests, integration-tests, performance-tests, enhanced-tests, security-checks, integration-coverage-check]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always()

    steps:
    - name: Check all test results
      run: |
        echo "========================================"
        echo "        TEST RESULTS SUMMARY"
        echo "========================================"
        echo ""
        echo "Unit Tests:        ${{ needs.unit-tests.result }}"
        echo "Widget Tests:      ${{ needs.widget-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Performance Tests: ${{ needs.performance-tests.result }}"
        echo "Enhanced Tests:    ${{ needs.enhanced-tests.result }}"
        echo "Security Checks:   ${{ needs.security-checks.result }}"
        echo ""

        # Track if we have any real failures vs cancellations
        CRITICAL_FAILURE=false
        CANCELLED_JOBS=""

        # Check unit tests - critical
        if [[ "${{ needs.unit-tests.result }}" == "cancelled" ]]; then
          CANCELLED_JOBS="$CANCELLED_JOBS unit-tests"
          echo "⚠️  Unit Tests were cancelled (not a code failure)"
        elif [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
          CRITICAL_FAILURE=true
          echo "❌ Unit Tests failed"
        fi

        # Check security checks - critical
        if [[ "${{ needs.security-checks.result }}" == "cancelled" ]]; then
          CANCELLED_JOBS="$CANCELLED_JOBS security-checks"
          echo "⚠️  Security Checks were cancelled (not a code failure)"
        elif [[ "${{ needs.security-checks.result }}" != "success" ]]; then
          CRITICAL_FAILURE=true
          echo "❌ Security Checks failed"
        fi

        # Check widget tests - important but not blocking
        if [[ "${{ needs.widget-tests.result }}" == "cancelled" ]]; then
          CANCELLED_JOBS="$CANCELLED_JOBS widget-tests"
          echo "⚠️  Widget Tests were cancelled"
        elif [[ "${{ needs.widget-tests.result }}" != "success" ]]; then
          echo "⚠️  Widget Tests failed (non-blocking)"
        fi

        # Check integration tests - known flaky, skipped on PWA-only PRs (see #490)
        if [[ "${{ needs.integration-tests.result }}" == "skipped" ]]; then
          echo "⏭️  Integration Tests skipped (no android/ or integration_test/ changes)"
        elif [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "⚠️  Integration Tests failed/cancelled (known flaky - see #29)"
        fi

        # Summary
        echo ""
        echo "========================================"
        if [ -n "$CANCELLED_JOBS" ]; then
          echo "ℹ️  Cancelled jobs:$CANCELLED_JOBS"
          echo "   This is typically due to workflow timeout or resource constraints."
          echo "   If all tests passed before cancellation, the code is likely fine."
        fi

        if [ "$CRITICAL_FAILURE" = true ]; then
          echo "❌ CRITICAL TESTS FAILED"
          exit 1
        else
          echo "✅ All critical tests passed (or were cancelled after passing)"
        fi

# Security scanning and dependency checks
  security-checks:
    name: Security and Dependency Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.35.1
        
    - name: Run dependency audit
      run: |
        cd fittrack
        flutter pub deps --json | jq '.packages[] | select(.kind != "direct") | .name' | sort | uniq
        
    - name: Check for known vulnerabilities
      run: |
        cd fittrack
        # Check for outdated packages
        flutter pub outdated --json

    - name: Dependency vulnerability audit (CVE check)
      uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
      with:
        scan-args: |-
          --lockfile=fittrack/pubspec.lock
        upload-sarif: false

    - name: Validate Firebase configuration
      run: |
        cd fittrack
        # Verify Firebase configuration is secure
        test -f firebase.json || exit 1
        test -f firestore.rules || exit 1

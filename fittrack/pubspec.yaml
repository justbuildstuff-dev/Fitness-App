name: fittrack
description: Overload - Structured Strength Tracker
publish_to: 'none'
version: 1.6.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1
  firebase_messaging: ^16.0.1

  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  shared_preferences: ^2.2.2

  # URL launcher
  url_launcher: ^6.2.0

  # HTTP client for Cloudflare Worker API calls
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Testing - minimal reliable setup with known working versions
  mockito: ^5.4.4
  build_runner: ^2.4.7
  test: ^1.24.0
  fake_cloud_firestore: ^4.0.1
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  
  # Fonts (optional)
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic